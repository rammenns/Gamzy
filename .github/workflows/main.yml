name: Build

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main

permissions:
  contents: write

jobs:

  # Windows x86-64

  windows-x86_64:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libraries.txt
          pip install pyinstaller

      - name: Building Executables
        run: |
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png;." --icon "gamzylogo.ico" --hidden-import=desktop_notifier.resources --name GamzScript script.py
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png;." --add-data "steamlogo.png;." --add-data "epiclogo.png;." --add-data "goglogo.png;." --add-data "itchlogo.png;." --add-data "ubilogo.png;." --add-data "Minecraftia-Regular.ttf;." --icon "gamzylogo.ico" --name Gamzy main.py

      - name: Building Installer
        run: |
          iscc setup-x86_64.iss

      - name: Uploading Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --json tagName --jq .tagName
          gh release upload $tag output/Gamzy-Setup-Windows-x86_64.exe --clobber


  # Windows ARM64
  
  windows-ARM64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libraries.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png;." --icon "gamzylogo.ico" --hidden-import=desktop_notifier.resources --name GamzScript script.py
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png;." --add-data "steamlogo.png;." --add-data "epiclogo.png;." --add-data "goglogo.png;." --add-data "itchlogo.png;." --add-data "ubilogo.png;." --add-data "Minecraftia-Regular.ttf;." --icon "gamzylogo.ico" --name Gamzy main.py

      - name: Setup
        run: |
          iscc setup-ARM64.iss
      
      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --json tagName --jq .tagName
          gh release upload $tag output/Gamzy-Setup-Windows-ARM64.exe --clobber

  # Linux x86-64
  
  linux-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libraries.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile main.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Gamzy-Linux-x64
          path: dist/main


  # Linux ARM64
  
  linux-ARM64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libraries.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile main.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Gamzy-Linux-ARM64
          path: dist/main
