name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:


  # Windows x86-64

  Windows-x86_64:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libraries.txt

      - name: Building Executables
        run: |
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png;." --icon "gamzylogo.ico" --hidden-import=desktop_notifier.resources --name GamzScript script.py
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png;." --add-data "steamlogo.png;." --add-data "epiclogo.png;." --add-data "goglogo.png;." --add-data "itchlogo.png;." --add-data "ubilogo.png;." --add-data "Minecraftia-Regular.ttf;." --icon "gamzylogo.ico" --name Gamzy main.py

      - name: Building Installer
        run: |
          iscc setup-x86_64.iss

      - name: Uploading Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --json tagName --jq .tagName
          gh release upload $tag output/Gamzy-Setup-Windows-x86_64.exe --clobber


  # Windows ARM64
  
  Windows-ARM64:
    runs-on: windows-11-vs2026-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libraries.txt

      - name: Building Executables
        run: |
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png;." --icon "gamzylogo.ico" --hidden-import=desktop_notifier.resources --name GamzScript script.py
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png;." --add-data "steamlogo.png;." --add-data "epiclogo.png;." --add-data "goglogo.png;." --add-data "itchlogo.png;." --add-data "ubilogo.png;." --add-data "Minecraftia-Regular.ttf;." --icon "gamzylogo.ico" --name Gamzy main.py

      - name: Building Installer
        run: |
          iscc setup-ARM64.iss
      
      - name: Uploading Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --json tagName --jq .tagName
          gh release upload $tag output/Gamzy-Setup-Windows-ARM64.exe --clobber


  # Linux x86-64
  
  Linux-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libraries.txt

      - name: Building Executables
        run: |
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png:." --icon "gamzylogo.ico" --hidden-import=desktop_notifier.resources --name GamzScript script.py
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png:." --add-data "steamlogo.png:." --add-data "epiclogo.png:." --add-data "goglogo.png:." --add-data "itchlogo.png:." --add-data "ubilogo.png:." --add-data "Minecraftia-Regular.ttf:." --add-data "linuxGamzyUpdate.sh.template:." --add-data "GamzScript.desktop.template:." --icon "gamzylogo.ico" --name Gamzy main.py

      - name: Building Linux package
        run: |
          mkdir -p package/Gamzy
          mkdir -p output
      
          cp dist/Gamzy package/Gamzy/
          cp dist/GamzScript package/Gamzy/
          cp "Create Shortcut.sh" package/Gamzy/
      
          chmod +x package/Gamzy/Gamzy
          chmod +x package/Gamzy/GamzScript
          chmod +x "package/Gamzy/Create Shortcut.sh"
      
          tar -czf output/Gamzy-Linux-x86_64.tar.gz -C package Gamzy
      
      - name: Uploading Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh release upload "$tag" output/Gamzy-Linux-x86_64.tar.gz --clobber


  # Linux ARM64
  
  Linux-ARM64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt5-qmake qt5-qmake-bin qtbase5-dev qtbase5-dev-tools
          sudo ln -sf /usr/lib/qt5/bin/qmake /usr/local/bin/qmake
          which qmake
          qmake -v

      - name: Check libraries
        run: |
          echo "=== libraries.txt ==="
          cat libraries.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sip==6.16.0" "PyQt-builder"
          python -m pip install PyQt5 --no-build-isolation --config-settings --qmake=/usr/lib/qt5/bin/qmake --config-settings --confirm-license=
          sed '/^[[:space:]]*PyQt5[[:space:]]*$/d' libraries.txt > libraries-without-pyqt.txt
          python -m pip install -r libraries-without-pyqt.txt

      - name: Building Executables
        run: |
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png:." --icon "gamzylogo.ico" --hidden-import=desktop_notifier.resources --name GamzScript script.py
          pyinstaller --onefile --noconsole --add-data "gamzylogo.png:." --add-data "steamlogo.png:." --add-data "epiclogo.png:." --add-data "goglogo.png:." --add-data "itchlogo.png:." --add-data "ubilogo.png:." --add-data "Minecraftia-Regular.ttf:." --add-data "linuxGamzyUpdate.sh.template:." --add-data "GamzScript.desktop.template:." --icon "gamzylogo.ico" --name Gamzy main.py

      - name: Building Linux package
        run: |
          mkdir -p package/Gamzy
          mkdir -p output
      
          cp dist/Gamzy package/Gamzy/
          cp dist/GamzScript package/Gamzy/
          cp "Create Shortcut.sh" package/Gamzy/
      
          chmod +x package/Gamzy/Gamzy
          chmod +x package/Gamzy/GamzScript
          chmod +x "package/Gamzy/Create Shortcut.sh"
      
          tar -czf output/Gamzy-Linux-ARM64.tar.gz -C package Gamzy
      
      - name: Uploading Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh release upload "$tag" output/Gamzy-Linux-ARM64.tar.gz --clobber


  # macOS x86-64

  macOS-x86_64:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libraries.txt
          pip install pyobjc-framework-ServiceManagement

      - name: Building Executables
        run: |
          pyinstaller --noconsole --add-data "gamzylogo.png:." --icon "gamzylogo.icns" --hidden-import=desktop_notifier.resources --osx-bundle-identifier "com.gamzy.GamzScript" --name GamzScript script.py
          pyinstaller --noconsole --add-data "steamlogo.png:." --add-data "epiclogo.png:." --add-data "goglogo.png:." --add-data "itchlogo.png:." --add-data "ubilogo.png:." --add-data "Minecraftia-Regular.ttf:." --add-data "adminpriv.applescript.template:." --add-data "macGamzyUpdate.sh.template:." --icon "gamzylogo.icns" --osx-bundle-identifier "com.gamzy.Gamzy" --name Gamzy main.py

      - name: Building Bundle
        run: |
          mkdir -p dist/Gamzy.app/Contents/Library/LaunchAgents

          mv dist/GamzScript.app \
            dist/Gamzy.app/Contents/Resources/GamzScript.app

          /usr/libexec/PlistBuddy \
            -c "Add :LSUIElement bool true" \
            dist/Gamzy.app/Contents/Resources/GamzScript.app/Contents/Info.plist

          cp "com.gamzy.GamzScript.plist" \
            dist/Gamzy.app/Contents/Library/LaunchAgents/

          cp "com.gamzy.GamzScript.legacy.plist" \
            dist/Gamzy.app/Contents/Library/LaunchAgents/

      - name: Code Signing
        run: |
          codesign --deep --force --sign - \
            dist/Gamzy.app/Contents/Resources/GamzScript.app

          codesign --deep --force --sign - \
            dist/Gamzy.app

      - name: Building DMG
        run: |
          mkdir -p output

          hdiutil create \
            -volname "Gamzy" \
            -srcfolder "dist/Gamzy.app" \
            -ov \
            -format UDZO \
            "output/Gamzy-macOS-x86_64.dmg"

      - name: Uploading Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh release upload "$tag" output/Gamzy-macOS-x86_64.dmg --clobber


  # macOS ARM64

  macOS-ARM64:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libraries.txt
          pip install pyobjc-framework-ServiceManagement

      - name: Building Executables
        run: |
          pyinstaller --noconsole --add-data "gamzylogo.png:." --icon "gamzylogo.icns" --hidden-import=desktop_notifier.resources --osx-bundle-identifier "com.gamzy.GamzScript" --name GamzScript script.py
          pyinstaller --noconsole --add-data "steamlogo.png:." --add-data "epiclogo.png:." --add-data "goglogo.png:." --add-data "itchlogo.png:." --add-data "ubilogo.png:." --add-data "Minecraftia-Regular.ttf:." --add-data "adminpriv.applescript.template:." --add-data "macGamzyUpdate.sh.template:." --icon "gamzylogo.icns" --osx-bundle-identifier "com.gamzy.Gamzy" --name Gamzy main.py

      - name: Building Bundle
        run: |
          mkdir -p dist/Gamzy.app/Contents/Library/LaunchAgents

          mv dist/GamzScript.app \
            dist/Gamzy.app/Contents/Resources/GamzScript.app

          /usr/libexec/PlistBuddy \
            -c "Add :LSUIElement bool true" \
            dist/Gamzy.app/Contents/Resources/GamzScript.app/Contents/Info.plist

          cp "com.gamzy.GamzScript.plist" \
            dist/Gamzy.app/Contents/Library/LaunchAgents/

          cp "com.gamzy.GamzScript.legacy.plist" \
            dist/Gamzy.app/Contents/Library/LaunchAgents/

      - name: Code Signing
        run: |
          codesign --deep --force --sign - \
            dist/Gamzy.app/Contents/Resources/GamzScript.app

          codesign --deep --force --sign - \
            dist/Gamzy.app

      - name: Building DMG
        run: |
          mkdir -p output

          hdiutil create \
            -volname "Gamzy" \
            -srcfolder "dist/Gamzy.app" \
            -ov \
            -format UDZO \
            "output/Gamzy-macOS-ARM64.dmg"

      - name: Uploading Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh release upload "$tag" output/Gamzy-macOS-ARM64.dmg --clobber
